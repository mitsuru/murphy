# Murphy rails pack bundled defaults — mirrors rubocop-rails 2.x config/default.yml.
#
# This file carries the non-`Rails/` cop overrides that rubocop-rails ships in
# its own `config/default.yml`, plus per-cop `Include`/`Exclude` file scopes
# for ported `Rails/*` cops whose upstream defaults restrict the files they
# run on (the engine's `cop_applies_to_file` gate reads them from this layer).
# RuboCop applies a plugin's default config as a layer beneath the user's
# `.rubocop.yml`, so a project that loads `rubocop-rails` (here: `murphy-rails`)
# inherits these option/exclude defaults unless it overrides them. Murphy
# mirrors that by merging this file's cop rules into the bundled-defaults
# layer (`apply_pack_default_layers`). Keep in sync with the pinned
# rubocop-rails version when bumping parity (currently 2.38.0, cf. murphy-4gd.1.15).
AllCops:
  ActiveSupportExtensionsEnabled: true
  # Mirrors rubocop-rails-2.x config/default.yml AllCops.Exclude. These join
  # Murphy's default base exclude layer when the rails pack is loaded, so
  # auto-generated / non-source files (notably db/schema.rb) are not linted.
  # A project's own AllCops.Exclude replaces this unless it sets
  # `inherit_mode: merge: [Exclude]` (RuboCop-compatible union).
  Exclude:
    - '**/app/assets/**/*'
    - bin/*
    - db/*schema.rb
    - log/**/*
    - public/**/*
    - storage/**/*

Lint/NumberConversion:
  # Rails' duration methods are added to the ignore list so calling `to_i` on
  # one of them does not register an offense.
  AllowedMethods:
    - ago
    - from_now
    - second
    - seconds
    - minute
    - minutes
    - hour
    - hours
    - day
    - days
    - week
    - weeks
    - fortnight
    - fortnights
    - in_milliseconds
  AllowedPatterns: []

Lint/RedundantSafeNavigation:
  # Adds `presence`/`present?` to the RuboCop core default.
  AllowedMethods:
    - instance_of?
    - kind_of?
    - is_a?
    - eql?
    - respond_to?
    - equal?
    - presence
    - present?

Lint/SafeNavigationChain:
  # Adds `presence_in` to the RuboCop core default.
  AllowedMethods:
    - present?
    - blank?
    - presence
    - presence_in
    - try
    - try!
    - in?

Lint/UselessAccessModifier:
  # Adds context-creating methods from `ActiveSupport::Concern` and
  # `Module::Concerning`.
  inherit_mode:
    merge:
      - ContextCreatingMethods
  ContextCreatingMethods:
    - class_methods
    - included
    - prepended
    - concern
    - concerning

Lint/UselessMethodDefinition:
  # Avoids conflict with the `Rails/LexicallyScopedActionFilter` cop.
  Exclude:
    - '**/app/controllers/**/*.rb'
    - '**/app/mailers/**/*.rb'

Style/AndOr:
  EnforcedStyle: conditionals

Style/CollectionCompact:
  AllowedReceivers:
    - params

Style/FormatStringToken:
  AllowedMethods:
    - redirect

Style/InvertibleUnlessCondition:
  InverseMethods:
    :present?: :blank?
    :blank?: :present?
    :include?: :exclude?
    :exclude?: :include?

Style/SymbolProc:
  AllowedMethods:
    - define_method
    - mail
    - respond_to

# --- Ported `Rails/*` file scopes (murphy-4gd.1.15 audit vs rubocop-rails 2.38.0) ---
# Only cops already ported to real (non-stub) implementations are listed; add
# entries here as further cops are ported. Each entry mirrors the upstream
# `Include`/`Exclude` exactly so the engine's `cop_applies_to_file` gate
# reproduces RuboCop's per-file scoping. See `crates/murphy-cli/tests/rails_pack_e2e.rs`
# `rails_pack_scopes_*` for the gate coverage.

Rails/ActionControllerTestCase:
  Include:
    - '**/test/**/*.rb'

Rails/ApplicationRecord:
  Exclude:
    - 'db/**/*.rb'

Rails/AssertNot:
  Include:
    - '**/test/**/*'

Rails/AttributeDefaultBlockValue:
  Include:
    - '**/app/models/**/*'

Rails/ContentTag:
  Exclude:
    - '**/app/models/**/*.rb'
    - '**/config/**/*.rb'

Rails/CreateTableWithTimestamps:
  Include:
    - 'db/**/*.rb'
  Exclude:
    - 'db/**/*_create_active_storage_tables.active_storage.rb'
    - 'db/**/*_create_active_storage_variant_records.active_storage.rb'

Rails/DangerousColumnNames:
  Include:
    - 'db/**/*.rb'

Rails/Delegate:
  Exclude:
    - '**/app/controllers/**/*.rb'

Rails/EnumHash:
  Include:
    - '**/app/models/**/*.rb'

Rails/EnumSyntax:
  Include:
    - '**/app/models/**/*.rb'
    - '**/lib/**/*.rb'

Rails/EnumUniqueness:
  Include:
    - '**/app/models/**/*.rb'

Rails/EnvironmentVariableAccess:
  Include:
    - '**/app/**/*.rb'
    - '**/config/initializers/**/*.rb'
    - '**/lib/**/*.rb'
  Exclude:
    - '**/lib/**/*.rake'

Rails/Exit:
  Include:
    - '**/app/**/*.rb'
    - '**/config/**/*.rb'
    - '**/lib/**/*.rb'
  Exclude:
    - '**/lib/**/*.rake'

Rails/HasAndBelongsToMany:
  Include:
    - '**/app/models/**/*.rb'

Rails/HasManyOrHasOneDependent:
  Include:
    - '**/app/models/**/*.rb'

Rails/HelperInstanceVariable:
  Include:
    - '**/app/helpers/**/*.rb'

Rails/HttpPositionalArguments:
  # Upstream only runs in spec/test files; without this the routing-DSL
  # `get :export, constraints: {...}` in `config/routes/*.rb` false-fires
  # (Mastodon murphy-bjrg.3).
  Include:
    - '**/spec/**/*'
    - '**/test/**/*'

Rails/HttpStatusNameConsistency:
  Include:
    - '**/app/controllers/**/*.rb'

Rails/I18nLazyLookup:
  Include:
    - '**/app/controllers/**/*.rb'

Rails/I18nLocaleAssignment:
  Include:
    - '**/spec/**/*.rb'
    - '**/test/**/*.rb'

Rails/IgnoredSkipActionFilterOption:
  Include:
    - '**/app/controllers/**/*.rb'
    - '**/app/mailers/**/*.rb'

Rails/InverseOf:
  Include:
    - '**/app/models/**/*.rb'

Rails/LexicallyScopedActionFilter:
  Include:
    - '**/app/controllers/**/*.rb'
    - '**/app/mailers/**/*.rb'

Rails/MailerName:
  Include:
    - '**/app/mailers/**/*.rb'

Rails/MatchRoute:
  Include:
    - '**/config/routes.rb'
    - '**/config/routes/**/*.rb'

Rails/MigrationClassName:
  Include:
    - 'db/**/*.rb'

Rails/MultipleRoutePaths:
  Include:
    - '**/config/routes.rb'
    - '**/config/routes/**/*.rb'

Rails/NotNullColumn:
  Include:
    - 'db/**/*.rb'

Rails/Output:
  Include:
    - '**/app/**/*.rb'
    - '**/config/**/*.rb'
    - 'db/**/*.rb'
    - '**/lib/**/*.rb'

Rails/RefuteMethods:
  Include:
    - '**/test/**/*'

# --- Ported `Rails/*` opt-out defaults (subset of upstream defaults) ---
# Cops below are opt-in upstream (`Enabled: false`); the pack layer must
# reproduce that so they stay silent unless the user enables them
# (Mastodon murphy-bjrg.3: `Rails/DefaultScope` flagged `default_scope`
# in `app/models/status.rb` although upstream leaves it disabled).

Rails/DefaultScope:
  Enabled: false
