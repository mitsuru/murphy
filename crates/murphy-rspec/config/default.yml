# Murphy rspec pack bundled defaults — mirrors rubocop-rspec's
# `config/default.yml` for the subset of per-cop file scoping that cannot be
# expressed through `#[cop]` / `#[option]` metadata.
#
# - `RSpec/DescribeClass: Exclude`: rubocop-rspec excludes the non-class spec
#   directories (features/requests/routing/system/views) from this cop, since
#   those specs describe behaviour with a string subject rather than a
#   constant. Without this layer Murphy fires `RSpec/DescribeClass` across
#   `spec/requests`, `spec/system`, etc. (275 false positives on mastodon).
# - `RSpec/BeforeAfterAll: Exclude`: rubocop-rspec excludes the helper files
#   (`spec_helper`, `rails_helper`, `support/**`) from this cop, since global
#   setup there legitimately uses `:all` / `:context` scope.
#
# The cops' other defaults (Enabled, Severity, IgnoredMetadata) are already
# encoded in the cops' Rust metadata / hand-rolled options, so they are not
# duplicated here.
RSpec/DescribeClass:
  Exclude:
    - "**/spec/features/**/*"
    - "**/spec/requests/**/*"
    - "**/spec/routing/**/*"
    - "**/spec/system/**/*"
    - "**/spec/views/**/*"
RSpec/BeforeAfterAll:
  Exclude:
    - "**/spec/spec_helper.rb"
    - "**/spec/rails_helper.rb"
    - "**/spec/support/**/*.rb"
# - `RSpec/SpecFilePathFormat: CustomTransform`: mirrors rubocop-rspec's
#   `config/default.yml` defaults (`RuboCop→rubocop`, `RSpec→rspec`). The
#   host merges user entries over these per-key (RuboCop deep-merge) and
#   bakes the result as `CustomTransformPairs` for the cop (murphy-bjrg.4);
#   without this layer a project relying on the defaults would still pass
#   (the cop hardcodes them as a backstop), but the layer keeps the
#   source of truth in config, matching upstream.
RSpec/SpecFilePathFormat:
  CustomTransform:
    RuboCop: rubocop
    RSpec: rspec
